<style>
/* ===== GLOBAL ===== */
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: system-ui, sans-serif;
}

.logo-container {
  position: relative; /* container for absolute positioning */
  width: 100%;        /* full width of page */
}

.page-logo {
  position: absolute; /* position relative to .logo-container */
  top: 1rem;          /* distance from top of page */
  right: 1rem;        /* distance from right edge */
  height: 4rem;       /* adjust logo size */
  width: auto;        /* maintain aspect ratio */
  z-index: 10;        /* above the Flourish content */
}

  @media (max-width: 767px) {
  .page-logo {
    height: 2.5rem;
  }
}

/* ===== EMBEDS ===== */
.flourish-container,
.graph-container,
.bar-container {
  width: 100%;
  position: relative;
}

iframe {
  width: 100%;
  border: none;
  display: block;
}

/* ===== DESKTOP ===== */
@media (min-width: 768px) {
  .flourish-container {
    aspect-ratio: 1 / 1;
    max-width: 1000px;
    margin: 0 auto;
  }

  .bar-container {
    aspect-ratio: 3 / 1;
    max-width: 1000px;
    margin: 0 auto;
  }

    .graph-container {
    aspect-ratio: 2 / 1;
    max-width: 1000px;
    margin: 0 auto;
  }

  iframe {
    position: absolute;
    inset: 0;
    height: 100%;
  }
}

/* ===== MOBILE ===== */
@media (max-width: 767px) {

  .flourish-container {
    aspect-ratio: 1 / 1.3;
  }

  .bar-container {
    aspect-ratio: 3.4 / 2;
  }

    .graph-container {
    aspect-ratio: 3.1 / 2;
  }

  iframe {
    position: absolute;
    inset: 0;
    height: 100%;
  }
}

/* ===== LINKS ===== */
a {
  color: inherit;
}
</style>

<body>
  <div class="logo-container">

  </div>
  
  <div class="bar-container">

  </div>

  </div>
</body>
