<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seat Projection</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --border: #e4e2db;
      --text-primary: #1a1a1a;
      --text-muted: #888;
      --track: #ebebeb;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: var(--text-primary);
      padding: 24px;
    }

    .chart {
      position: relative;
    }

    .party-row {
      display: grid;
      grid-template-columns: 80px 1fr 100px;
      align-items: center;
      gap: 6px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.4s ease both;
    }

    .party-row:last-child { border-bottom: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .party-row:nth-child(1) { animation-delay: 0.05s; }
    .party-row:nth-child(2) { animation-delay: 0.10s; }
    .party-row:nth-child(3) { animation-delay: 0.15s; }
    .party-row:nth-child(4) { animation-delay: 0.20s; }
    .party-row:nth-child(5) { animation-delay: 0.25s; }
    .party-row:nth-child(6) { animation-delay: 0.30s; }

    .party-label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .party-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .party-name {
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-wrap {
      position: relative;
      height: 40px;
      display: flex;
      align-items: center;
      overflow: visible;
    }

    .track-bg {
      position: absolute;
      inset: 0;
      background: var(--track);
    }

    .range-outer {
      position: absolute;
      height: 100%;
      opacity: 0.25;
    }

    .range-mid {
      position: absolute;
      height: 100%;
      opacity: 0.55;
    }

    .range-inner {
      position: absolute;
      height: 100%;
      opacity: 0.9;
    }

    .avg-line {
      position: absolute;
      width: 1px;
      height: calc(100% + 5px);
      background: #000;
      z-index: 5;
    }

    .seat-info {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
    }

    .seat-count {
      font-size: 1rem;
      font-weight: 500;
    }

    .seat-range-label {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .tooltip {
      position: fixed;
      background: #1a1a1a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.72rem;
      padding: 8px 12px;
      border-radius: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
      white-space: nowrap;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
  .party-row {
    grid-template-columns: 56px 1fr 72px;
  }
  .track-wrap {
    height: 28px;
  }
  .party-name {
    font-size: 0.72rem;
  }
  .seat-count {
    font-size: 0.82rem;
  }
  .seat-range-label {
    font-size: 0.58rem;
  }
}
    
  </style>
</head>
<body>

<div class="chart" id="chart"></div>

<div class="tooltip" id="tooltip"></div>

<script>
  const TOTAL = 96;
  const MAJORITY = 48;

  const parties = [
    { name: "LAB", color: "#e4003B", data: [11, 12, 13, 15, 18, 20, 23] },
    { name: "CON", color: "#0087DC", data: [ 3,  4,  6,  8,  10, 11, 13] },
    { name: "PLC", color: "#005B54", data: [27, 28, 31, 34, 35, 37, 39] },
    { name: "GRN", color: "#6AB023", data: [ 1,  2,  3,  5,  7,  8,  11] },
    { name: "LDM", color: "#FAA61A", data: [ 0,  0,  1,  2,  2,  3,  4] },
    { name: "RFM", color: "#34D8EF", data: [26, 28, 30, 32, 35, 37, 39] },
  ];

  parties.sort((a, b) => b.data[3] - a.data[3]);

  const domainMin = 0;
  const domainMax = 50;

  function pct(val) {
    return ((val - domainMin) / (domainMax - domainMin)) * 100;
  }

  const chart = document.getElementById("chart");

  parties.forEach((party, i) => {
    const [p5, p15, p25, avg, p75, p85, p95] = party.data;

    const row = document.createElement("div");
    row.className = "party-row";

    const label = document.createElement("div");
    label.className = "party-label";
    label.innerHTML = `
      <span class="party-dot" style="background:${party.color}"></span>
      <span class="party-name">${party.name}</span>
    `;

    const trackWrap = document.createElement("div");
    trackWrap.className = "track-wrap";

    const trackBg = document.createElement("div");
    trackBg.className = "track-bg";

    const rangeOuter = document.createElement("div");
    rangeOuter.className = "range-outer";
    rangeOuter.style.cssText = `left:${pct(p5)}%;width:${pct(p95)-pct(p5)}%;background:${party.color};`;

    const rangeMid = document.createElement("div");
    rangeMid.className = "range-mid";
    rangeMid.style.cssText = `left:${pct(p15)}%;width:${pct(p85)-pct(p15)}%;background:${party.color};`;

    const rangeInner = document.createElement("div");
    rangeInner.className = "range-inner";
    rangeInner.style.cssText = `left:${pct(p25)}%;width:${pct(p75)-pct(p25)}%;background:${party.color};`;

    const avgLine = document.createElement("div");
    avgLine.className = "avg-line";
    avgLine.style.cssText = `left:calc(${pct(avg).toFixed(2)}% - 0.5px);`;

    const majLine = document.createElement("div");
    majLine.style.cssText = `
      position:absolute;top:0;bottom:0;
      left:${pct(MAJORITY)}%;
      width:1px;
      background:repeating-linear-gradient(to bottom,#aaa 0px,#aaa 4px,transparent 4px,transparent 8px);
      z-index:4;pointer-events:none;
    `;

    trackWrap.append(trackBg, rangeOuter, rangeMid, rangeInner, avgLine, majLine);

    const seatInfo = document.createElement("div");
    seatInfo.className = "seat-info";
    seatInfo.innerHTML = `
      <span class="seat-count" style="color:${party.color}">${avg} seats</span>
      <span class="seat-range-label">${p5}–${p95}</span>
    `;

    row.append(label, trackWrap, seatInfo);
    chart.appendChild(row);

  });
</script>
</body>
</html>
