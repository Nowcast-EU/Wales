<style>
/* ===== GLOBAL ===== */
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: system-ui, sans-serif;
}

/* ===== HEADER ===== */
.page-header {
  font-family: "Poppins", system-ui, sans-serif;
  width: 100%;
  padding: 0 1rem;    /* left/right gutter */
  text-align: left;
}

/* Flex row: text block left, logo right */
.title-row {
  display: flex;
  align-items: flex-start; /* logo aligns with top of text block */
  white-space: nowrap;
  overflow: hidden;
}

/* Wrapper for title + subtitle */
.title-text {
  display: inline-block;   /* defines the block height for logo */
  min-width: 0;            /* critical for shrinking in flexbox */
  white-space: nowrap;
  overflow: hidden;
}

/* Title */
.title-text h1 {
  margin: 0;
  font-size: clamp(1.4rem, 4.5vw, 4rem);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Subtitle */
.subtitle {
  margin: 0;
  font-size: clamp(0.9rem, 2.8vw, 1.6rem);
  font-weight: 400;         /* NOT bold */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 0.15em;       /* small spacing under title */
}

/* Logo scales to match combined title + subtitle height */
.title-logo {
  height: auto;
  max-height: 100%;
  margin-left: 0.5rem;
  flex-shrink: 0;
  object-fit: contain;
}

/* ===== EMBEDS ===== */
.flourish-container,
.bar-container {
  width: 100%;
  position: relative;
}

iframe {
  width: 100%;
  border: none;
  display: block;
}

/* ===== DESKTOP ===== */
@media (min-width: 768px) {
  .flourish-container {
    aspect-ratio: 1 / 1;
    max-width: 1000px;
    margin: 0 auto;
  }

  .bar-container {
    aspect-ratio: 2.8 / 1;
    max-width: 1000px;
    margin: 0 auto;
  }

  iframe {
    position: absolute;
    inset: 0;
    height: 100%;
  }
}

/* ===== MOBILE ===== */
@media (max-width: 767px) {
  .page-header {
    width: 90vw;  /* more room for scaling */
  }

  .title-text h1 {
    font-size: clamp(1rem, 6vw, 2.5rem);
  }

  .subtitle {
    font-size: clamp(0.8rem, 4vw, 1.2rem);
  }

  .title-logo {
    max-height: 2.5em;  /* prevents it from being huge on tiny screens */
  }

  .flourish-container {
    aspect-ratio: 1 / 1.3;
  }

  .bar-container {
    aspect-ratio: 3 / 2;
  }

  iframe {
    position: absolute;
    inset: 0;
    height: 100%;
  }
}

/* ===== LINKS ===== */
a {
  color: inherit;
}
</style>

      </p>
    </div>

  </div>
</header>

  </div>

  </div>
</body>
