<style>
/* ===== GLOBAL ===== */
html, body {
  margin: 0;
  padding: 0;
  background: #ffffff;
  font-family: system-ui, sans-serif;
}

.logo-container {
  position: relative; /* container for absolute positioning */
  width: 100%;        /* full width of page */
}

.page-logo {
  position: absolute; /* position relative to .logo-container */
  top: 0.3rem;          /* distance from top of page */
  right: 0.3rem;        /* distance from right edge */
  height: 4rem;       /* adjust logo size */
  width: auto;        /* maintain aspect ratio */
  z-index: 10;        /* above the Flourish content */
}

  .divider {
  border: none;
  border-top: 1px solid #d0d0d0;
  margin: 20px 0;
}

  @media (max-width: 767px) {
  .page-logo {
    height: 2.5rem;
  }
}

/* ===== EMBEDS ===== */
.flourish-container,
.graph-container,
.bar-container {
  width: 100%;
  position: relative;
}

iframe {
  width: 100%;
  border: none;
  display: block;
}

  /* ===== MAJORITY LINE (BAR CHART ONLY) ===== */
.majority-line {
  position: absolute;
  left: 50%;                 /* 50% = majority threshold */
  top: 70%;                  /* start halfway down */
  bottom: 10%;                 /* extend to bottom */
  width: 2px;
  background: rgba(0, 0, 0, 0.45);
  transform: translateX(-50%);
  z-index: 5;
  pointer-events: none;      /* critical for iframe interaction */
}

  .majority-line {
  background: none;
  border-left: 2px dashed rgba(0, 0, 0, 0.45);
}

  /* ===== MAJORITY LABEL ===== */
.majority-label {
  position: absolute;
  top: 100%;              /* directly beneath the line */
  margin-top: 6px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  font-weight: 500;
  color: rgba(0, 0, 0, 0.6);
  white-space: nowrap;
  pointer-events: none;
}



/* ===== DESKTOP ===== */
@media (min-width: 768px) {
  .flourish-container {
    aspect-ratio: 1 / 1;
    max-width: 1000px;
    margin: 0 auto;
  }

  .bar-container {
    aspect-ratio: 4 / 1;
    max-width: 1000px;
    margin: 0 auto;
  }

    .graph-container {
    aspect-ratio: 1.7 / 1;
    max-width: 1000px;
    margin: 0 auto;
  }

  iframe {
    position: absolute;
    inset: 0;
    height: 100%;
  }
}

/* ===== MOBILE ===== */
@media (max-width: 767px) {

  .flourish-container {
    aspect-ratio: 1 / 1.3;
  }

  .bar-container {
    aspect-ratio: 4 / 2;
  }

    .graph-container {
    aspect-ratio: 2.5 / 2;
  }

  iframe {
    position: absolute;
    inset: 0;
    height: 100%;
  }
}

/* ===== LINKS ===== */
a {
  color: inherit;
}
</style>
</head>
<body>
  <div class="logo-container">
    <img src="WalesLogo.png" alt="Logo" class="page-logo">
  </div>

  <div class="flourish-container">
    <iframe src="https://flo.uri.sh/visualisation/27084487/embed" scrolling="no" frameborder="0"></iframe>
  </div>
  
<div class="bar-container">
<div class="majority-line">
  <span class="majority-label">Majority</span>
</div>

  <iframe src="https://flo.uri.sh/visualisation/27084497/embed"
          scrolling="no"
          frameborder="0"></iframe>
</div>


    <div class="graph-container">
    <iframe src="https://flo.uri.sh/visualisation/27177225/embed" scrolling="no" frameborder="0"></iframe>
  </div>
</body>
